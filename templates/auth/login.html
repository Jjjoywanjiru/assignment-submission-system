{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Log in</h1>
        <form method="post">
          <div class="mb-3">
            <label class="form-label d-block">Log in as</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="role"
                     id="role-student" value="student"
                     {% if request.form.get('role') != 'lecturer' %}checked{% endif %}>
              <label class="form-check-label" for="role-student">Student</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="role"
                     id="role-lecturer" value="lecturer"
                     {% if request.form.get('role') == 'lecturer' %}checked{% endif %}>
              <label class="form-check-label" for="role-lecturer">Lecturer</label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="mt-3 mb-0 small">New student? <a href="/register">Register here</a>. Lecturer accounts are created by the administrator.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
