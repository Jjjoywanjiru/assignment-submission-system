{% extends "base.html" %}
{% block title %}New assignment{% endblock %}
{% block content %}
<h2>New assignment</h2>
<form method="post" class="mt-3" style="max-width: 640px;">
  <div class="mb-3">
    <label class="form-label" for="title">Title</label>
    <input class="form-control" id="title" name="title" value="{{ form.get('title', '') }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="description">Description</label>
    <textarea class="form-control" id="description" name="description" rows="5" required>{{ form.get('description', '') }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label" for="deadline">Deadline</label>
    <input class="form-control" type="datetime-local" id="deadline" name="deadline" value="{{ form.get('deadline', '') }}" required>
  </div>
  <button class="btn btn-primary" type="submit">Create assignment</button>
  <a class="btn btn-secondary" href="{{ url_for('lecturer.assignments') }}">Cancel</a>
</form>
{% endblock %}
